name: checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - uses: https://git.mpluta.dev/mikey/actions/forge-ssh@main
        with:
          key: ${{ secrets.SECRETS_REPOSITORY_PRIVATE_KEY }}
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "${PWD}"
      - name: Check the flake
        run: nix flake check --accept-flake-config --all-systems

  list-hosts:
    runs-on: nix
    outputs:
      list: ${{ steps.hosts.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: https://git.mpluta.dev/mikey/actions/forge-ssh@main
        with:
          key: ${{ secrets.SECRETS_REPOSITORY_PRIVATE_KEY }}
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "${PWD}"
      - name: List the hosts
        id: hosts
        run: echo "list=$(nix eval --json --accept-flake-config .#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  build:
    needs: list-hosts
    runs-on: nix
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.list-hosts.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: https://git.mpluta.dev/mikey/actions/forge-ssh@main
        with:
          key: ${{ secrets.SECRETS_REPOSITORY_PRIVATE_KEY }}
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "${PWD}"

      - uses: https://git.mpluta.dev/mikey/actions/attic-use@main
        with:
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build the host
        run: |
          nix build --no-link --print-out-paths --accept-flake-config \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

      - uses: https://git.mpluta.dev/mikey/actions/attic-push@main
        with:
          token: ${{ secrets.ATTIC_TOKEN }}

  readme:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - uses: https://git.mpluta.dev/mikey/actions/forge-ssh@main
        with:
          key: ${{ secrets.SECRETS_REPOSITORY_PRIVATE_KEY }}
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "${PWD}"
      # For pull_request this builds the merge commit, so the check reflects the
      # merged tree rather than a stale PR branch.
      - name: Generate the README service list
        run: nix develop --accept-flake-config --command just readme /tmp/README.generated
      - name: Verify README.md is up to date
        run: |
          if ! diff -u README.md /tmp/README.generated; then
            echo "::error::README.md is out of date. Run 'just readme'."
            exit 1
          fi
