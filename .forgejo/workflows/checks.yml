name: checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - uses: https://git.mpluta.dev/mikey/actions/forge-ssh@main
        with:
          key: ${{ secrets.SECRETS_REPOSITORY_PRIVATE_KEY }}
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "${PWD}"
      - name: Check the flake
        run: nix flake check --accept-flake-config --all-systems

  list-hosts:
    runs-on: nix
    outputs:
      pr-hosts: ${{ steps.hosts.outputs.pr-hosts }}
      base-hosts: ${{ steps.hosts.outputs.base-hosts }}
      all-hosts: ${{ steps.hosts.outputs.all-hosts }}
    steps:
      - uses: actions/checkout@v4
      - uses: https://git.mpluta.dev/mikey/actions/forge-ssh@main
        with:
          key: ${{ secrets.SECRETS_REPOSITORY_PRIVATE_KEY }}
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "${PWD}"
      - name: List the hosts
        id: hosts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pr=$(bin/list-hosts HEAD)
          echo "pr-hosts=$pr" >> "$GITHUB_OUTPUT"

          # Base and combined host lists, for pull requests
          if [ -n "$BASE_SHA" ]; then
            git fetch --depth 1 origin "$BASE_SHA"
            base=$(bin/list-hosts "$BASE_SHA")
            echo "base-hosts=$base" >> "$GITHUB_OUTPUT"
            echo "all-hosts=$(jq -cn --argjson a "$base" --argjson b "$pr" '$a + $b | unique')" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: list-hosts
    runs-on: nix
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.list-hosts.outputs.pr-hosts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: https://git.mpluta.dev/mikey/actions/forge-ssh@main
        with:
          key: ${{ secrets.SECRETS_REPOSITORY_PRIVATE_KEY }}
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "${PWD}"

      - uses: https://git.mpluta.dev/mikey/actions/attic-use@main
        with:
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build the host
        id: build
        run: |
          path=$(nix build --no-link --print-out-paths --accept-flake-config \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel")
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: https://git.mpluta.dev/mikey/actions/attic-push@main
        with:
          token: ${{ secrets.ATTIC_TOKEN }}
          paths: ${{ steps.build.outputs.path }}

  readme:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - uses: https://git.mpluta.dev/mikey/actions/forge-ssh@main
        with:
          key: ${{ secrets.SECRETS_REPOSITORY_PRIVATE_KEY }}
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "${PWD}"
      # For pull_request this builds the merge commit, so the check reflects the
      # merged tree rather than a stale PR branch.
      - name: Generate the README service list
        run: nix develop --accept-flake-config --command just readme /tmp/README.generated
      - name: Verify README.md is up to date
        run: |
          if ! diff -u README.md /tmp/README.generated; then
            echo "::error::README.md is out of date. Run 'just readme'."
            exit 1
          fi

  diff:
    if: github.event_name == 'pull_request'
    needs:
      - list-hosts
      - build
    runs-on: nix
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.list-hosts.outputs.all-hosts) }}
    env:
      HOST: ${{ matrix.host }}
      MARKER: "<!-- diff:${{ matrix.host }} -->"
    steps:
      - uses: actions/checkout@v4
      - uses: https://git.mpluta.dev/mikey/actions/forge-ssh@main
        with:
          key: ${{ secrets.SECRETS_REPOSITORY_PRIVATE_KEY }}
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "${PWD}"
      - uses: https://git.mpluta.dev/mikey/actions/attic-use@main
        with:
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Diff the host against the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_HOSTS: ${{ needs.list-hosts.outputs.base-hosts }}
          PR_HOSTS: ${{ needs.list-hosts.outputs.pr-hosts }}
        run: |
          build() { # build <flake-dir>
            nix build --no-link --print-out-paths --accept-flake-config \
              "$1#nixosConfigurations.$HOST.config.system.build.toplevel"
          }
          has_host() { # has_host <host-list>
            jq -e --arg h "$HOST" 'index($h)' <<< "$1" > /dev/null
          }

          {
            echo "$MARKER"
            echo "### Diff / $HOST"
            echo
            if ! has_host "$BASE_HOSTS"; then
              echo "New host."
            elif ! has_host "$PR_HOSTS"; then
              echo "Removed by this PR."
            else
              {
                git fetch --depth 1 origin "$BASE_SHA"
                git worktree add /tmp/base "$BASE_SHA"
                git config --global --add safe.directory /tmp/base
              } >&2
              base=$(build "git+file:///tmp/base?shallow=1")
              pr=$(build .)
              if [ "$base" = "$pr" ]; then
                echo "No changes compared to $BASE_REF (${BASE_SHA:0:8})."
              else
                echo "<details open><summary>Changes compared to $BASE_REF (${BASE_SHA:0:8})</summary>"
                echo
                echo '```'
                nix run --accept-flake-config --inputs-from . nixpkgs#nvd -- --color never diff "$base" "$pr" \
                  | grep -v "^<<< \|^>>> "
                echo '```'
                echo
                echo "</details>"
              fi
            fi
          } > /tmp/diff.md

          cat /tmp/diff.md

      - name: Post or update the comment
        env:
          TOKEN: ${{ forgejo.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"

          # Shortens the comment to fit Forgejo's size limit.
          if [ "$(wc -c < /tmp/diff.md)" -gt 60000 ]; then
            { head -c 60000 /tmp/diff.md; printf '\n```\n\n</details>\n\nCut short, see the job log for the full diff.\n'; } > /tmp/comment.md
          else
            cp /tmp/diff.md /tmp/comment.md
          fi
          payload=$(jq -n --rawfile body /tmp/comment.md '{body: $body}')

          id=$(curl -sSf -H "Authorization: token $TOKEN" "$api/issues/$PR/comments" \
            | jq -r --arg m "$MARKER" 'map(select(.body | startswith($m))) | .[0].id // empty')

          if [ -z "$id" ]; then
            curl -sSf -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "$payload" "$api/issues/$PR/comments" > /dev/null
            echo "Posted the comment."
          else
            curl -sSf -X PATCH -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "$payload" "$api/issues/comments/$id" > /dev/null
            echo "Updated comment $id."
          fi

  merge:
    name: Ready to Merge
    if: always()
    needs:
      - lint
      - list-hosts
      - build
      - readme
    runs-on: nix
    steps:
      - name: Check the results
        run: |
          for result in "${{ needs.lint.result }}" "${{ needs.list-hosts.result }}" \
            "${{ needs.build.result }}" "${{ needs.readme.result }}"; do
            [ "$result" = success ] || { echo "A needed job ended with: $result"; exit 1; }
          done
