name: deploy
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  list-hosts:
    if: github.ref == 'refs/heads/main'
    runs-on: nix
    outputs:
      list: ${{ steps.hosts.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: https://git.mpluta.dev/mikey/actions/forge-ssh@main
        with:
          key: ${{ secrets.SECRETS_REPOSITORY_PRIVATE_KEY }}
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "${PWD}"
      - name: List the hosts
        id: hosts
        run: echo "list=$(bin/list-hosts HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy ${{ matrix.host }}
    needs: list-hosts
    if: github.ref == 'refs/heads/main'
    runs-on: nix
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.list-hosts.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: https://git.mpluta.dev/mikey/actions/forge-ssh@main
        with:
          key: ${{ secrets.SECRETS_REPOSITORY_PRIVATE_KEY }}
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "${PWD}"

      - uses: https://git.mpluta.dev/mikey/actions/attic-use@main
        with:
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Add the deploy key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null ~/.ssh/deploy
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy

      # Checks already run in the checks workflow.
      - name: Deploy the host
        env:
          HOST: ${{ matrix.host }}
        run: >-
          nix develop --accept-flake-config --command deploy --skip-checks
          --ssh-user deploy --ssh-opts "-i $HOME/.ssh/deploy -o IdentitiesOnly=yes" ".#$HOST"
