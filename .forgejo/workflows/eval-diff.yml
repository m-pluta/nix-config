name: eval diff
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MARKER: "<!-- eval-diff -->"

jobs:
  eval-diff:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - uses: https://git.mpluta.dev/mikey/actions/forge-ssh@main
        with:
          key: ${{ secrets.SECRETS_REPOSITORY_PRIVATE_KEY }}
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "${PWD}"
      - uses: https://git.mpluta.dev/mikey/actions/attic-use@main
        with:
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Diff each host against the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          build() { # build <flake-dir> <host>
            nix build --no-link --print-out-paths --accept-flake-config \
              "$1#nixosConfigurations.$2.config.system.build.toplevel"
          }

          git fetch --depth 1 origin "$BASE_SHA"
          git worktree add /tmp/base "$BASE_SHA"
          git config --global --add safe.directory /tmp/base

          list_hosts() { # list_hosts <flake-dir>
            nix eval --json --accept-flake-config "$1#nixosConfigurations" --apply builtins.attrNames
          }
          base_hosts=$(list_hosts /tmp/base)
          pr_hosts=$(list_hosts .)
          hosts=$(jq -rn --argjson a "$base_hosts" --argjson b "$pr_hosts" '$a + $b | unique | .[]')

          {
            echo "$MARKER"
            echo "## Changes per host"
            echo
            echo "Base: \`${BASE_SHA:0:8}\`"
            for h in $hosts; do
              echo
              if ! jq -e --arg h "$h" 'index($h)' <<< "$base_hosts" > /dev/null; then
                build . "$h" > /dev/null
                echo "<details open><summary><code>$h</code>: new host</summary></details>"
              elif ! jq -e --arg h "$h" 'index($h)' <<< "$pr_hosts" > /dev/null; then
                echo "<details open><summary><code>$h</code>: removed host</summary></details>"
              else
                base=$(build /tmp/base "$h")
                pr=$(build . "$h")
                if [ "$base" = "$pr" ]; then
                  echo "<details><summary><code>$h</code>: no changes</summary></details>"
                else
                  echo "<details open><summary><code>$h</code></summary>"
                  echo
                  echo '```'
                  nix run --accept-flake-config --inputs-from . nixpkgs#nvd -- --color never diff "$base" "$pr"
                  echo '```'
                  echo
                  echo "</details>"
                fi
              fi
            done
          } > /tmp/eval-diff.md

          cat /tmp/eval-diff.md

      - name: Post or update the comment
        env:
          TOKEN: ${{ forgejo.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"

          # Shortens the comment to fit Forgejo's size limit.
          if [ "$(wc -c < /tmp/eval-diff.md)" -gt 60000 ]; then
            { head -c 60000 /tmp/eval-diff.md; printf '\n```\n\nCut short, see the job log for the full diff.\n'; } > /tmp/comment.md
          else
            cp /tmp/eval-diff.md /tmp/comment.md
          fi
          payload=$(jq -n --rawfile body /tmp/comment.md '{body: $body}')

          id=
          page=1
          while :; do
            comments=$(curl -sSf -H "Authorization: token $TOKEN" "$api/issues/$PR/comments?limit=50&page=$page")
            [ "$(jq length <<< "$comments")" -gt 0 ] || break
            id=$(jq -r --arg m "$MARKER" 'map(select(.body | startswith($m))) | .[0].id // empty' <<< "$comments")
            [ -z "$id" ] || break
            page=$((page + 1))
          done

          if [ -z "$id" ]; then
            curl -sSf -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "$payload" "$api/issues/$PR/comments" > /dev/null
            echo "Posted the comment."
          else
            curl -sSf -X PATCH -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "$payload" "$api/issues/comments/$id" > /dev/null
            echo "Updated comment $id."
          fi
