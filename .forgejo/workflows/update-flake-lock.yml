name: Update flake.lock
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_BRANCH: main
  PR_BRANCH: automation/update-flake-lock

jobs:
  update-flake-lock:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}
      - uses: https://git.mpluta.dev/mikey/actions/forge-ssh@main
        with:
          key: ${{ secrets.SECRETS_REPOSITORY_PRIVATE_KEY }}
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "${PWD}"

      - name: Update flake.lock
        run: |
          set -o pipefail
          nix flake update --accept-flake-config 2>&1 | tee /tmp/flake-update.log

      - name: Set the commit author
        run: |
          git config user.name automation
          git config user.email automation@noreply.git.mpluta.dev

      - name: Commit and push to PR branch
        id: commit
        run: |
          if git diff --quiet -- flake.lock; then
            echo "No flake.lock changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B "$PR_BRANCH"
          git add flake.lock
          git commit -m "chore: update flake.lock"
          git push -f origin "$PR_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          body="$(printf '```\n%s\n```\n' "$(cat /tmp/flake-update.log)" | jq -Rs .)"
          payload="$(jq -n \
            --arg head "$PR_BRANCH" \
            --arg base "$BASE_BRANCH" \
            --arg title "chore: update flake.lock" \
            --argjson body "$body" \
            '{head:$head, base:$base, title:$title, body:$body}')"

          num="$(curl -sSf -H "Authorization: token $TOKEN" \
            "$api/pulls?state=open&limit=50" \
            | jq -r --arg b "$PR_BRANCH" \
                '.[] | select(.head.ref==$b) | .number' | head -n1)"

          if [ -z "$num" ]; then
            curl -sSf -X POST -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" "$api/pulls" >/dev/null
            echo "Opened new pull request."
          else
            curl -sSf -X PATCH -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(echo "$payload" | jq '{title,body}')" \
              "$api/pulls/$num" >/dev/null
            echo "Refreshed existing pull request #$num."
          fi
